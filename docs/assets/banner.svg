<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="ShopFlow Datagen: Deterministic e-commerce data at any scale, with counted dirty-data injection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/><stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="0.45" stop-color="#f5fbff"/>
      <stop offset="0.55" stop-color="#f5fbff"/><stop offset="1" stop-color="#2dd4bf"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.30"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2430" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 1040px 180px; }
      @keyframes pulse { 0%, 100% { transform: scale(0.92); opacity: .65; } 50% { transform: scale(1.08); opacity: 1; } }
      .fade { opacity: 0; animation: fade 8s infinite; }
      @keyframes fade { 0% { opacity: 0; transform: translateY(8px); } 6% { opacity: 1; transform: none; } 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
      .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 8s ease-out infinite; }
      @keyframes grow { 0% { transform: scaleY(0); } 18% { transform: scaleY(1); } 88% { transform: scaleY(1); opacity: 1; } 96%, 100% { transform: scaleY(1); opacity: 0; } }
      .growx { transform-box: fill-box; transform-origin: left; animation: growx 8s ease-out infinite; }
      @keyframes growx { 0% { transform: scaleX(0); } 18% { transform: scaleX(1); } 88% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
      .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 8s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 35% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { opacity: 0; } }
      .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .9s; }
      .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
      .d7 { animation-delay: 2.1s; } .d8 { animation-delay: 2.4s; } .d9 { animation-delay: 2.7s; }
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.55"/>
  <circle class="pulse" cx="1040" cy="180" r="175" fill="url(#glow)"/>
  <rect x="64" y="64" width="6" height="232" rx="3" fill="#2dd4bf"/>
  <text x="96" y="96" class="mono" font-size="16" fill="#2dd4bf" letter-spacing="2">30 DAYS · DAY 00</text>
  <text x="92" y="160" class="sans" font-size="78" font-weight="800" fill="url(#shine)">ShopFlow Datagen</text>
  <text x="96" y="212" class="sans" font-size="20" fill="#9aa7b2">Deterministic e-commerce data at any scale, with counted</text><text x="96" y="238" class="sans" font-size="20" fill="#9aa7b2">dirty-data injection</text>
  <rect x="96" y="262" width="71" height="28" rx="14" fill="#161b22" stroke="#2dd4bf" stroke-opacity="0.45"/><text x="132" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Python</text><rect x="177" y="262" width="71" height="28" rx="14" fill="#161b22" stroke="#2dd4bf" stroke-opacity="0.45"/><text x="213" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Polars</text><rect x="258" y="262" width="79" height="28" rx="14" fill="#161b22" stroke="#2dd4bf" stroke-opacity="0.45"/><text x="298" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Parquet</text>
  <g><rect x="850" y="40" width="380" height="280" rx="14" fill="#0f141b" stroke="#2a3542"/><text x="870" y="68" class="mono" font-size="12" fill="#8b949e">order_id  customer  total_cents</text><line x1="866" y1="78" x2="1214" y2="78" stroke="#2a3542"/><clipPath id="rowsclip"><rect x="852" y="82" width="376" height="200"/></clipPath><g clip-path="url(#rowsclip)"><g><text x="870" y="100" class="mono" font-size="13" fill="#2dd4bf">100001    4210           12990</text><text x="870" y="122" class="mono" font-size="13" fill="#c9d1d9">100002    4247           14723</text><text x="870" y="144" class="mono" font-size="13" fill="#2dd4bf">100003    4284           16456</text><text x="870" y="166" class="mono" font-size="13" fill="#c9d1d9">100004    4321           18189</text><text x="870" y="188" class="mono" font-size="13" fill="#2dd4bf">100005    4358           19922</text><text x="870" y="210" class="mono" font-size="13" fill="#c9d1d9">100006    4395           21655</text><text x="870" y="232" class="mono" font-size="13" fill="#2dd4bf">100007    4432           23388</text><text x="870" y="254" class="mono" font-size="13" fill="#c9d1d9">100008    4469           25121</text><text x="870" y="276" class="mono" font-size="13" fill="#2dd4bf">100009    4506           26854</text><text x="870" y="298" class="mono" font-size="13" fill="#c9d1d9">100010    4543           28587</text><text x="870" y="320" class="mono" font-size="13" fill="#2dd4bf">100011    4580           30320</text><text x="870" y="342" class="mono" font-size="13" fill="#c9d1d9">100012    4617           32053</text><text x="870" y="364" class="mono" font-size="13" fill="#2dd4bf">100013    4654           33786</text><text x="870" y="386" class="mono" font-size="13" fill="#c9d1d9">100014    4691           35519</text><text x="870" y="408" class="mono" font-size="13" fill="#2dd4bf">100015    4728           37252</text><text x="870" y="430" class="mono" font-size="13" fill="#c9d1d9">100016    4765           38985</text><text x="870" y="452" class="mono" font-size="13" fill="#2dd4bf">100017    4802           40718</text><text x="870" y="474" class="mono" font-size="13" fill="#c9d1d9">100018    4839           42451</text><animateTransform attributeName="transform" type="translate" values="0 0; 0 -176" dur="5s" repeatCount="indefinite"/></g></g><rect x="866" y="286" width="348" height="24" rx="12" fill="#161b22" stroke="#2dd4bf"/><text x="1040" y="303" text-anchor="middle" class="mono" font-size="12" fill="#2dd4bf">~820k rows/s · deterministic seed · dirty mode</text></g>
</svg>
